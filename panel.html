<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VilldoesZ Client</title>

<style>
body{
    margin:0;
    background:#f3f3f3;
    font-family:Arial,sans-serif;
    font-size:12px;
    color:#333;
}

.header{
    background:#efefef;
    border-bottom:1px solid #d0d0d0;
    padding:8px;
    display:flex;
    align-items:center;
    gap:8px;
}

.logo{
    width:34px;
    height:34px;
    background:#1976d2;
    border-radius:3px;
}

.title{
    font-size:13px;
    font-weight:bold;
}

.section{
    background:#fff;
    margin:8px;
    padding:10px;
    border:1px solid #ddd;
}

.section-title{
    font-size:15px;
    margin-bottom:10px;
    font-weight:bold;
}

label{
    display:block;
    margin-bottom:4px;
}

select,
textarea{
    width:100%;
    box-sizing:border-box;
    border:1px solid #cfcfcf;
    padding:5px;
    font-size:12px;
}

textarea{
    height:80px;
    resize:vertical;
}

button{
    background:#f8f8f8;
    border:1px solid #bfbfbf;
    padding:6px 10px;
    margin-top:8px;
    cursor:pointer;
}

button:hover{
    background:#ececec;
}

.output{
    margin-top:8px;
    min-height:50px;
    border:1px solid #d5d5d5;
    background:#fafafa;
    padding:8px;
    white-space:pre-wrap;
    word-break:break-word;
    font-family:Consolas,monospace;
}

.footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#f3f3f3;
    border-top:1px solid #d0d0d0;
    display:flex;
}

.tab{
    flex:1;
    text-align:center;
    padding:8px;
    cursor:pointer;
    border-right:1px solid #d0d0d0;
}

.tab:last-child{
    border-right:none;
}

.active{
    background:#fff;
    font-weight:bold;
}

.content{
    padding-bottom:50px;
}
</style>
</head>

<body>

<div class="header">
    <img src="icon.png" class="logo" alt="VilldoesZ Logo">
    <div class="title">VilldoesZ Client</div>
</div>

<div class="content">

<div id="tellrawPage">

<div class="section">
    <div class="section-title">Tellraw Editor</div>

    <label>Edition</label>

    <select id="edition">
        <option value="java">Java Edition</option>
        <option value="bedrock">Bedrock Edition</option>
    </select>

    <br><br>

    <label>Message</label>

    <textarea id="message" placeholder="Enter your message here..."></textarea>

    <button id="generateBtn">
        Generate Command
    </button>

    <button id="copyBtn">
        Copy Command
    </button>

    <div class="output" id="output">
Generated command will appear here.
    </div>
</div>

</div>

<div id="linksPage" style="display:none">

<div class="section">
    <div class="section-title">Links</div>

    <button id="channelBtn">
        Open YouTube Channel
    </button>

    <button id="feedbackBtn">
        Send Feedback
    </button>

    <p>
        youtube.com/@villdoesclips
    </p>
</div>

</div>

</div>

<div class="footer">
    <div class="tab active" id="tellrawTab">
        Tellraw
    </div>

    <div class="tab" id="linksTab">
        Links
    </div>
</div>

<script src="panel.js"></script>

</body>
</html>
